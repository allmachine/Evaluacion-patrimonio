<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Formulario</title>
</head>
<body class="F-F">

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <p style="padding-left: 50px; font-size: 25px;">Formulario</p>
            <div style="display: flex; gap: 20px; padding-right: 50px;">
                <a href="../index.html">Inicio</a>
            </div>
        </div>
    </header> 

    <div>
        <form id="formulario" method="get">
            <div class="Tarjetas">
                <h1 class="F-T">Datos personales</h1>
                <div class="campos">
                    <div class="campo">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Nombre" required minlength="3" maxlength="30">
</div>
<div class="campo">
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" placeholder="Apellido" required minlength="3" maxlength="30">
</div>
                    <div class="campo">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
                    </div>
                    <div class="campo">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required>
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha de nacimiento:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="campo">
                        <label for="Region">Región:</label>
                        <select id="Region" name="Region" required>
                            <option value="">Seleccione</option>
                            <option value="arica_parinacota">Región de Arica y Parinacota</option>
                            <option value="tarapaca">Región de Tarapacá</option>
                            <option value="antofagasta">Región de Antofagasta</option>
                            <option value="atacama">Región de Atacama</option>
                            <option value="coquimbo">Región de Coquimbo</option>
                            <option value="valparaiso">Región de Valparaíso</option>
                            <option value="metropolitana">Región Metropolitana de Santiago</option>
                            <option value="ohiggins">Región del Libertador General Bernardo O'Higgins</option>
                            <option value="maule">Región del Maule</option>
                            <option value="nuble">Región de Ñuble</option>
                            <option value="biobio">Región del Biobío</option>
                            <option value="araucania">Región de La Araucanía</option>
                            <option value="los_rios">Región de Los Ríos</option>
                            <option value="los_lagos">Región de Los Lagos</option>
                            <option value="aysen">Región de Aysén del General Carlos Ibáñez del Campo</option>
                            <option value="magallanes">Región de Magallanes y de la Antártica Chilena</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="Tarjetas">
                <h1 class="F-T">Información académica</h1>
                <div class="campos">
                    <div class="campo">
                        <label style="padding-bottom: 10px;">Nivel educacional:</label>
                        <div class="L-O">
                            <label><input type="radio" name="estudios" value="media" required> Enseñanza media</label>
                            <label><input type="radio" name="estudios" value="tecnico"> Técnico</label>
                            <label><input type="radio" name="estudios" value="universitario"> Universitario</label>
                            <label><input type="radio" name="estudios" value="otro"> Otro</label>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="Carrera-int">Carrera de interés:</label>
                        <select id="Carrera-int" name="Carrera-int" required>
                            <option value="">Seleccione</option>
                            <option value="informatica">Informática</option>
                            <option value="enfermeria">Enfermería</option>
                            <option value="administracion">Administración de empresas</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="Tarjetas">
                <h1 class="F-T">Áreas de interés</h1>
                <div class="lista-opciones-grid">
                    <label><input type="checkbox" name="area" value="tecnologia"> Tecnología</label>
                    <label><input type="checkbox" name="area" value="administracion"> Administración</label>
                    <label><input type="checkbox" name="area" value="salud"> Salud</label>
                    <label><input type="checkbox" name="area" value="diseno"> Diseño</label>
                    <label><input type="checkbox" name="area" value="educacion"> Educación</label>
                    <label><input type="checkbox" name="area" value="otra"> Otra</label>
                </div>
            </div>

            <div class="Tarjetas">
                <h1 class="F-T">Adjuntar currículum</h1>
                <div class="campo-archivo" style="text-align: center;">
                    <input type="file" id="curriculum" name="curriculum" accept=".pdf,.doc,.docx"><br>
                    <p>Formatos permitidos: PDF, DOC, DOCX (Tamaño máximo: 5 MB)</p>
                </div>
            </div>

            <div class="contenedor-botones">
                <button type="submit" class="btn-enviar">Enviar formulario</button>
                <button type="reset" class="btn-limpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/localization/messages_es.min.js"></script>
    <script src="../js/funciones.js"></script>
</body>
</html>
