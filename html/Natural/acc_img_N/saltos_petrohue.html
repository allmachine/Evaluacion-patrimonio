<!--Titulo-->

            <div class="carousel-item active">

            </div>

            <!-- Imagen 2 -->
            <div class="carousel-item">

            <br>

            <li><strong>Declaración:</strong> Geositio Nacional (SERNAGEOMIN)</li>
            <br>

            <li><strong>Estado:</strong> Protegido, dentro del Parque Nacional Vicente Pérez Rosales</li>
            <br>

        </ul>
