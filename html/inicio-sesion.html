<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sesion.css">
    <title>Iniciar sesión</title>
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1 class="titulo">Iniciar sesión</h1>
            <form id="formLogin">
                <div class="nosexd">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Jose Pedro" required>
                </div>
                <div class="nosexd">
                    <label for="contraseña">Contraseña:</label>
                    <input type="password" name="contraseña" id="contraseña" placeholder="Hola123" required>
                </div>
                <div class="nosexd">
                    <label for="gmail">Gmail:</label>
                    <input type="email" name="gmail" id="gmail" placeholder="ejemplo@gmail.com" required>
                </div>
               
                    <button type="submit">Guardar</button>
                    <a href="../index.html">Volver</a>
                    <a href="inicio-sesion.html">Iniciar sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        formLogin.addEventListener('submit', function (e) {
    e.preventDefault();

    const gmail = document.getElementById('gmail').value.trim().toLowerCase();
    const clave = document.getElementById('contraseña').value;

    const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
    const usuario = usuarios.find(u => u.gmail.toLowerCase() === gmail && u.contraseña === clave);

    if (usuario) {
        localStorage.setItem('sesion', JSON.stringify({ nombre: usuario.nombre, gmail: usuario.gmail }));
        window.location.href = 'agendar.html';  
    } else {
        alert('Gmail o contraseña incorrectos'); 
    }
});
        
    </script>
</body>
</html>
