<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sesion.css">
    <title>Crear cuenta</title>
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1 class="titulo">Creación de cuenta</h1>
            <form id="formRegistro">
                <div class="nosexd">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Jose Pedro" required>
                </div>
                <div class="nosexd">
                    <label for="gmail">Gmail:</label>
                    <input type="email" name="gmail" id="gmail" placeholder="ejemplo@gmail.com" required>
                </div>
                <div class="nosexd">
                    <label for="contraseña">Contraseña:</label>
                    <input type="password" name="contraseña" id="contraseña" placeholder="Hola123" required>
                </div>
                <div>
                    <button type="submit">Guardar</button>
                    <a href="../index.html">Volver</a>
                    <a href="inicio-sesion.html">Iniciar sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formRegistro');

        formulario.addEventListener('submit', function (e) {
            e.preventDefault(); // evita que intente ir a /registro

            const usuario = {
                nombre: document.getElementById('nombre').value.trim(),
                gmail: document.getElementById('gmail').value.trim(),
                contraseña: document.getElementById('contraseña').value
            };

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            usuarios.push(usuario);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            formulario.reset();
            alert('Cuenta creada');
        });
    </script>
</body>
</html>
