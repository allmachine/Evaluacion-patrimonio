<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sesion.css">
    <title>Iniciar sesion</title>
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1 class="titulo">Inicio de sesion</h1>
            <form action="/login" method="post">
                <div class="nosexd">
                    <label for="nombre"> Nombre:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Jose Pedro" required>
                </div>
                <div class="nosexd">
                    <label for="gmail">Gmail:</label>
                    <input type="email" placeholder="ejemplo@gmail.com" required id="gmail" name="gmail">
                </div>
                <div class="nosexd">
                    <label for="contraseña">Contraseña:</label>
                    <input type="password" name="contraseña" id="contraseña" required placeholder="Hola123">
                </div>
                <div>
                    <button type="submit"> Enviar</button>
                    <button> <a href="../index.html">Volver</a></button>
                    <button> <a href="creacion-sesion.html">Crear cuenta</a></button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
